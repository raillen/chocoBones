<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Wireframe</title>
<style>
    :root {
        --border-color: #555;
        --bg-gray: #eee;
    }
    body {
        font-family: monospace;
        margin: 0;
        padding: 20px;
        background-color: #e5e5e5;
    }
    .wireframe-app {
        max-width: 1024px;
        margin: 0 auto;
        background: white;
        border: 2px solid var(--border-color);
        display: grid;
        grid-template-areas: 
            "sidebar header"
            "sidebar content";
        grid-template-columns: 250px 1fr;
        grid-template-rows: 60px 1fr;
        min-height: 800px;
    }
    header {
        grid-area: header;
        border-bottom: 2px solid var(--border-color);
        display: flex;
        align-items: center;
        padding: 0 20px;
        background: var(--bg-gray);
    }
    aside {
        grid-area: sidebar;
        border-right: 2px solid var(--border-color);
        padding: 20px;
        background: var(--bg-gray);
    }
    main {
        grid-area: content;
        padding: 30px;
    }
    .placeholder-box {
        border: 2px dashed var(--border-color);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #666;
        background: #fafafa;
        margin-bottom: 20px;
    }
    .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 30px;
    }
    .metrics .placeholder-box { height: 100px; margin-bottom: 0; }
    .chart .placeholder-box { height: 300px; }
    .nav-item {
        border: 1px solid var(--border-color);
        padding: 10px;
        margin-bottom: 10px;
        text-align: center;
    }
</style>
</head>
<body>
<div class="wireframe-app">
    <aside>
        <h2>[ Logo ]</h2>
        <div class="nav-item">Dashboard</div>
        <div class="nav-item">Users</div>
        <div class="nav-item">Settings</div>
    </aside>
    <header>
        <h3>[ Global Search ]</h3>
        <div style="margin-left: auto;">[ User Avatar ]</div>
    </header>
    <main>
        <h1>Dashboard Overview</h1>
        <div class="metrics">
            <div class="placeholder-box">Metric 1</div>
            <div class="placeholder-box">Metric 2</div>
            <div class="placeholder-box">Metric 3</div>
        </div>
        <div class="chart">
            <div class="placeholder-box">Main Activity Chart</div>
        </div>
    </main>
</div>
</body>
</html>
